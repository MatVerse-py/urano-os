name: ARGUS-ARGOS CI

on:
  pull_request:
    paths:
      - 'src/urano_kernel/argus_argos/**'
      - 'tests/test_argus_argos*.py'
      - 'ARGUS_ARGOS_ARCHITECTURE_V0.md'
      - '.github/workflows/argus-argos-ci.yml'
  push:
    branches:
      - feature/argus-argos-core-v0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q src tests
      - name: ARGUS-ARGOS unit and pipeline tests
        run: python -m unittest tests.test_argus_argos tests.test_argus_pipeline -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
