name: publication-bridge

on:
  push:
    branches:
      - feature/scientific-publication-bridge
  pull_request:
    paths:
      - 'src/urano_kernel/publication_resolver.py'
      - 'src/urano_kernel/bridge.py'
      - 'urano/views-publications.js'
      - 'urano/views.js'
      - 'urano/URANO OSX.html'
      - 'tests/test_publication_resolver.py'
      - '.github/workflows/publication-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest tests.test_publication_resolver -v
