name: URANO OS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Kernel smoke test
        run: python -m src.urano_kernel.kernel
